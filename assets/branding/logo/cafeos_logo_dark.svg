    <path d="M 82 34 C 74 18, 92 8, 100 12 C 108 8, 126 18, 118 34 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 82 40 L 118 40 C 120 40, 121 48, 119 50 L 81 50 C 79 48, 80 40, 82 40 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Ears -->
    <path d="M 46 64 C 34 50, 52 32, 68 44 C 74 48, 68 62, 58 66 Z" fill="#222222" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 154 64 C 166 50, 148 32, 132 44 C 126 48, 132 62, 142 66 Z" fill="#222222" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Head Base -->
    <path d="M 100 48 C 50 48, 38 78, 38 116 C 38 156, 62 178, 100 178 C 138 178, 162 156, 162 116 C 162 78, 150 48, 100 48 Z" fill="#222222" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
