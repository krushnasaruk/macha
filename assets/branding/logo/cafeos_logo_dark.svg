    <path d="M 84 86 C 88 72, 60 68, 52 82 C 45 94, 60 114, 76 110 C 86 107, 82 94, 84 86 Z" fill="#CCCCCC" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 116 86 C 112 72, 140 68, 148 82 C 155 94, 140 114, 124 110 C 114 107, 118 94, 116 86 Z" fill="#CCCCCC" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
