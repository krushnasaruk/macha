    <!-- Eyes, Nose, Mouth -->
    <ellipse cx="68" cy="91" rx="4.5" ry="5.5" fill="#000000"/>
    <ellipse cx="132" cy="91" rx="4.5" ry="5.5" fill="#000000"/>
    <ellipse cx="100" cy="122" rx="10.5" ry="7.5" fill="#000000"/>
    <path d="M 100 129 L 100 141 M 94 143 C 97 141, 103 141, 106 143" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="130" y="68" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#000000" letter-spacing="-1">
    CaféOS
  </text>
  <text x="132" y="92" font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#333333" letter-spacing="3">
    KITCHEN &amp; BILLING ENGINE
  </text>
</svg>
